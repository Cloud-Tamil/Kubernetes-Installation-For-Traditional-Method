apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: frontend-hpa
  namespace: shopsphere

spec:

  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shopsphere-frontend

  minReplicas: 3
  maxReplicas: 10

  behavior:

    scaleUp:
      stabilizationWindowSeconds: 0

    scaleDown:
      stabilizationWindowSeconds: 300

  metrics:

    - type: Resource

      resource:
        name: cpu

        target:
          type: Utilization
          averageUtilization: 70
