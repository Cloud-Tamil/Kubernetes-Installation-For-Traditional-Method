apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopsphere-frontend
  namespace: shopsphere

spec:

  replicas: 3

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: shopsphere-frontend

  template:

    metadata:
      labels:
        app: shopsphere-frontend
        app.kubernetes.io/name: shopsphere
        app.kubernetes.io/component: frontend

    spec:

      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:

        - name: frontend

          image: shopsphere/frontend:1.0.0

          ports:
            - containerPort: 8080

          resources:

            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /
              port: 8080

            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 8080

            periodSeconds: 20

          securityContext:

            allowPrivilegeEscalation: false

            capabilities:
              drop:
                - ALL
