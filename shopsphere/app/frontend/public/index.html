<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ShopSphere</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; }
    h1 { color: #2c3e50; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin: 12px 0; }
  </style>
</head>
<body>
  <h1>🛒 ShopSphere</h1>
  <div class="card">
    <h2>Products</h2>
    <div id="products">Loading...</div>
  </div>
  <script>
    fetch('/api/products')
      .then(r => r.json())
      .then(data => {
        document.getElementById('products').textContent =
          JSON.stringify(data, null, 2);
      })
      .catch(err => {
        document.getElementById('products').textContent = 'Error: ' + err;
      });
  </script>
</body>
</html>
